<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2048 · chirag.chill</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Nunito+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #1b1f2e; --bg-soft: #20263a; --surface: #242a3d; --surface-hover: #2b3250;
    --border: #383f5c; --text: #ede7da; --text-muted: #9aa0bd;
    --amber: #e8a854; --amber-dim: rgba(232,168,84,0.16); --sage: #7fb3a3; --radius: 12px;
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--text); font-family: 'Nunito Sans', sans-serif; -webkit-font-smoothing: antialiased; touch-action: none; }
  h1, h2 { font-family: 'Fraunces', serif; font-weight: 600; margin: 0; }
  a { color: inherit; text-decoration: none; }
  :focus-visible { outline: 2px solid var(--amber); outline-offset: 3px; }

  .topbar { display: flex; padding: 20px clamp(20px,6vw,56px); }
  .topbar a { font-family: 'Fraunces', serif; font-size: 1rem; color: var(--text-muted); transition: color .15s ease; }
  .topbar a:hover { color: var(--amber); }

  main { max-width: 420px; margin: 0 auto; padding: 6px 20px 80px; text-align: center; }
  h1.title { font-size: 2rem; margin-bottom: 16px; }

  .scorebar { display: flex; justify-content: center; gap: 12px; margin-bottom: 18px; }
  .score-box { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 8px 18px; min-width: 84px; }
  .score-box .label { font-size: 0.68rem; color: var(--text-muted); text-transform: lowercase; }
  .score-box .value { font-family: 'Fraunces', serif; font-size: 1.3rem; color: var(--amber); }

  .board-wrap {
    position: relative; background: var(--bg-soft); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 8px; margin: 0 auto 18px; max-width: 360px;
  }
  .board {
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px;
  }
  .tile {
    aspect-ratio: 1; border-radius: 8px; display: flex; align-items: center; justify-content: center;
    font-family: 'Fraunces', serif; font-weight: 700; font-size: 1.4rem; background: var(--surface);
    transition: background .1s ease;
  }
  .tile.spawn { animation: pop .18s ease; }
  .tile.merged { animation: bounce .16s ease; }
  @keyframes pop { from { transform: scale(0.5); opacity: 0.4; } to { transform: scale(1); opacity: 1; } }
  @keyframes bounce { 0% { transform: scale(1); } 50% { transform: scale(1.12); } 100% { transform: scale(1); } }
  @media (prefers-reduced-motion: reduce) { .tile.spawn, .tile.merged { animation: none; } }

  .msg { min-height: 1.6em; margin-bottom: 14px; color: var(--sage); font-weight: 700; }
  .hint { color: var(--text-muted); font-size: 0.85rem; margin-bottom: 20px; }

  .reset-btn {
    background: var(--amber); color: #1b1f2e; border: none; padding: 11px 26px; border-radius: 999px;
    font-family: 'Nunito Sans', sans-serif; font-weight: 800; font-size: 0.9rem; cursor: pointer;
  }
  .reset-btn:hover { opacity: 0.9; }
</style>
</head>
<body>

<div class="topbar"><a href="index.html">&larr; chirag.chill</a></div>

<main>
  <h1 class="title">2048</h1>

  <div class="scorebar">
    <div class="score-box"><div class="label">score</div><div class="value" id="score">0</div></div>
    <div class="score-box"><div class="label">best</div><div class="value" id="best">0</div></div>
  </div>

  <p class="msg" id="msg"></p>

  <div class="board-wrap">
    <div class="board" id="board"></div>
  </div>

  <p class="hint">Arrow keys, WASD, or swipe to move.</p>
  <button class="reset-btn" id="resetBtn">New game</button>
</main>

<script>
  const SIZE = 4;
  const TILE_COLORS = {
    2: '#2b3250', 4: '#333b5c', 8: '#e8c48a', 16: '#e8b56a', 32: '#e8a854',
    64: '#e2933f', 128: '#d97f2e', 256: '#c96f28', 512: '#b85f22',
    1024: '#a44f1c', 2048: '#7fb3a3', 4096: '#5f9c8a'
  };

  let board, score, best, won, gameOver;

  const boardEl = document.getElementById('board');
  const scoreEl = document.getElementById('score');
  const bestEl = document.getElementById('best');
  const msgEl = document.getElementById('msg');

  function emptyBoard() {
    return Array.from({ length: SIZE }, () => Array(SIZE).fill(0));
  }

  function rotateCW(m) {
    const n = m.length;
    const res = Array.from({ length: n }, () => Array(n).fill(0));
    for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) res[c][n - 1 - r] = m[r][c];
    return res;
  }
  function rotateCCW(m) {
    const n = m.length;
    const res = Array.from({ length: n }, () => Array(n).fill(0));
    for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) res[n - 1 - c][r] = m[r][c];
    return res;
  }

  function slideRowLeftWithFlags(row) {
    const filtered = [];
    for (const v of row) if (v !== 0) filtered.push(v);
    const outRow = [];
    const merged = [];
    let i = 0;
    while (i < filtered.length) {
      if (i + 1 < filtered.length && filtered[i] === filtered[i + 1]) {
        const val = filtered[i] * 2;
        score += val;
        outRow.push(val);
        merged.push(true);
        i += 2;
      } else {
        outRow.push(filtered[i]);
        merged.push(false);
        i += 1;
      }
    }
    while (outRow.length < row.length) { outRow.push(0); merged.push(false); }
    return { row: outRow, merged };
  }

  const ROTATIONS = { left: 0, up: 3, right: 2, down: 1 };

  function move(dir) {
    const rotations = ROTATIONS[dir];
    let b = board;
    for (let i = 0; i < rotations; i++) b = rotateCW(b);

    let moved = false;
    const flagsBoard = [];
    const newB = b.map(row => {
      const before = row.join(',');
      const { row: after, merged } = slideRowLeftWithFlags(row);
      if (before !== after.join(',')) moved = true;
      flagsBoard.push(merged);
      return after;
    });

    let resultBoard = newB, resultFlags = flagsBoard;
    for (let i = 0; i < rotations; i++) {
      resultBoard = rotateCCW(resultBoard);
      resultFlags = rotateCCW(resultFlags);
    }
    return { board: resultBoard, flags: resultFlags, moved };
  }

  function emptyCells(b) {
    const cells = [];
    for (let r = 0; r < SIZE; r++) for (let c = 0; c < SIZE; c++) if (b[r][c] === 0) cells.push([r, c]);
    return cells;
  }

  function spawnTile(b) {
    const cells = emptyCells(b);
    if (cells.length === 0) return null;
    const [r, c] = cells[Math.floor(Math.random() * cells.length)];
    b[r][c] = Math.random() < 0.9 ? 2 : 4;
    return [r, c];
  }

  function hasMovesLeft(b) {
    for (let r = 0; r < SIZE; r++) {
      for (let c = 0; c < SIZE; c++) {
        if (b[r][c] === 0) return true;
        if (c < SIZE - 1 && b[r][c] === b[r][c + 1]) return true;
        if (r < SIZE - 1 && b[r][c] === b[r + 1][c]) return true;
      }
    }
    return false;
  }

  function render(spawnPos, mergedFlags) {
    boardEl.innerHTML = '';
    for (let r = 0; r < SIZE; r++) {
      for (let c = 0; c < SIZE; c++) {
        const val = board[r][c];
        const div = document.createElement('div');
        div.className = 'tile';
        if (val) {
          div.textContent = val;
          div.style.background = TILE_COLORS[val] || '#4a5580';
          div.style.color = val <= 4 ? 'var(--text)' : (val >= 2048 ? '#12261f' : '#1b1f2e');
          if (mergedFlags && mergedFlags[r][c]) div.classList.add('merged');
        } else {
          div.style.background = 'var(--surface)';
        }
        if (spawnPos && spawnPos[0] === r && spawnPos[1] === c) div.classList.add('spawn');
        boardEl.appendChild(div);
      }
    }
    scoreEl.textContent = score;
    bestEl.textContent = best;
  }

  function handleMove(dir) {
    if (gameOver) return;
    const result = move(dir);
    if (!result.moved) return;
    board = result.board;
    if (score > best) {
      best = score;
      localStorage.setItem('chiragchill-2048-best', String(best));
    }
    const spawnPos = spawnTile(board);

    if (!won && board.some(row => row.includes(2048))) {
      won = true;
      msgEl.textContent = 'You reached 2048! Keep going for a higher score.';
    }
    if (!hasMovesLeft(board)) {
      gameOver = true;
      msgEl.textContent = 'No more moves — game over.';
    }
    render(spawnPos, result.flags);
  }

  function newGame() {
    board = emptyBoard();
    score = 0;
    won = false;
    gameOver = false;
    msgEl.textContent = '';
    spawnTile(board);
    spawnTile(board);
    render();
  }

  document.addEventListener('keydown', e => {
    const map = { ArrowLeft: 'left', ArrowRight: 'right', ArrowUp: 'up', ArrowDown: 'down',
                  a: 'left', d: 'right', w: 'up', s: 'down' };
    const dir = map[e.key];
    if (dir) { e.preventDefault(); handleMove(dir); }
  });

  let touchStartX = 0, touchStartY = 0;
  document.addEventListener('touchstart', e => {
    touchStartX = e.touches[0].clientX;
    touchStartY = e.touches[0].clientY;
  }, { passive: true });
  document.addEventListener('touchend', e => {
    const dx = e.changedTouches[0].clientX - touchStartX;
    const dy = e.changedTouches[0].clientY - touchStartY;
    if (Math.max(Math.abs(dx), Math.abs(dy)) < 24) return;
    if (Math.abs(dx) > Math.abs(dy)) handleMove(dx > 0 ? 'right' : 'left');
    else handleMove(dy > 0 ? 'down' : 'up');
  }, { passive: true });

  document.getElementById('resetBtn').addEventListener('click', newGame);

  best = Number(localStorage.getItem('chiragchill-2048-best') || 0);
  newGame();
</script>

</body>
</html>
