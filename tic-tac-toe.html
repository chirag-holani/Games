<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tic-Tac-Toe · chirag.chill</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Nunito+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #1b1f2e; --bg-soft: #20263a; --surface: #242a3d; --surface-hover: #2b3250;
    --border: #383f5c; --text: #ede7da; --text-muted: #9aa0bd;
    --amber: #e8a854; --amber-dim: rgba(232,168,84,0.16); --sage: #7fb3a3; --radius: 12px;
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--text); font-family: 'Nunito Sans', sans-serif; -webkit-font-smoothing: antialiased; }
  h1, h2 { font-family: 'Fraunces', serif; font-weight: 600; margin: 0; }
  a { color: inherit; text-decoration: none; }
  :focus-visible { outline: 2px solid var(--amber); outline-offset: 3px; }

  .topbar { display: flex; padding: 20px clamp(20px,6vw,56px); }
  .topbar a { font-family: 'Fraunces', serif; font-size: 1rem; color: var(--text-muted); transition: color .15s ease; }
  .topbar a:hover { color: var(--amber); }

  main { max-width: 460px; margin: 0 auto; padding: 10px 20px 80px; text-align: center; }
  h1.title { font-size: 2rem; margin-bottom: 22px; }

  .modes { display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; margin-bottom: 20px; }
  .mode-btn {
    background: var(--surface); border: 1px solid var(--border); color: var(--text-muted);
    padding: 8px 14px; border-radius: 999px; font-family: 'Nunito Sans', sans-serif; font-size: 0.82rem;
    cursor: pointer; transition: all .15s ease;
  }
  .mode-btn.active { border-color: var(--amber); color: var(--amber); background: var(--amber-dim); }
  .mode-btn:hover { border-color: var(--amber); }

  .status { min-height: 1.6em; margin-bottom: 18px; color: var(--text-muted); font-size: 1rem; }
  .status.win { color: var(--amber); font-weight: 700; }

  .board {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px;
    width: 100%; max-width: 320px; margin: 0 auto 26px;
  }
  .cell {
    aspect-ratio: 1; background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
    font-family: 'Fraunces', serif; font-size: 2.6rem; display: flex; align-items: center; justify-content: center;
    cursor: pointer; color: var(--text); transition: background .15s ease, border-color .15s ease;
  }
  .cell:hover:not(:disabled) { background: var(--surface-hover); border-color: var(--border); }
  .cell:disabled { cursor: default; }
  .cell.x { color: var(--amber); }
  .cell.o { color: var(--sage); }
  .cell.win-cell { border-color: var(--amber); background: var(--amber-dim); }

  .reset-btn {
    background: var(--amber); color: #1b1f2e; border: none; padding: 11px 26px; border-radius: 999px;
    font-family: 'Nunito Sans', sans-serif; font-weight: 800; font-size: 0.9rem; cursor: pointer;
  }
  .reset-btn:hover { opacity: 0.9; }
</style>
</head>
<body>

<div class="topbar"><a href="index.html">&larr; chirag.chill</a></div>

<main>
  <h1 class="title">Tic-Tac-Toe</h1>

  <div class="modes">
    <button class="mode-btn active" data-mode="2p">2 Player</button>
    <button class="mode-btn" data-mode="easy">Vs Computer (Easy)</button>
    <button class="mode-btn" data-mode="hard">Vs Computer (Unbeatable)</button>
  </div>

  <p class="status" id="status">X's turn</p>

  <div class="board" id="board"></div>

  <button class="reset-btn" id="resetBtn">New game</button>
</main>

<script>
  const LINES = [
    [0,1,2],[3,4,5],[6,7,8],
    [0,3,6],[1,4,7],[2,5,8],
    [0,4,8],[2,4,6]
  ];

  let board = Array(9).fill(null);
  let current = 'X';
  let mode = '2p'; // '2p' | 'easy' | 'hard'
  let gameOver = false;

  const boardEl = document.getElementById('board');
  const statusEl = document.getElementById('status');
  const resetBtn = document.getElementById('resetBtn');
  const modeBtns = document.querySelectorAll('.mode-btn');

  function checkResult(b) {
    for (const [a, bIdx, c] of LINES) {
      if (b[a] && b[a] === b[bIdx] && b[a] === b[c]) return { winner: b[a], line: [a, bIdx, c] };
    }
    if (b.every(v => v)) return { winner: 'draw', line: [] };
    return null;
  }

  function minimax(b, player, ai, human) {
    const result = checkResult(b);
    if (result) {
      if (result.winner === ai) return { score: 1 };
      if (result.winner === human) return { score: -1 };
      return { score: 0 };
    }
    const moves = [];
    for (let i = 0; i < 9; i++) {
      if (!b[i]) {
        b[i] = player;
        const r = minimax(b, player === ai ? human : ai, ai, human);
        moves.push({ index: i, score: r.score });
        b[i] = null;
      }
    }
    if (player === ai) {
      return moves.reduce((best, m) => (m.score > best.score ? m : best), moves[0]);
    }
    return moves.reduce((best, m) => (m.score < best.score ? m : best), moves[0]);
  }

  function render() {
    boardEl.innerHTML = '';
    const result = checkResult(board);
    board.forEach((val, i) => {
      const btn = document.createElement('button');
      btn.className = 'cell' + (val === 'X' ? ' x' : val === 'O' ? ' o' : '');
      if (result && result.line.includes(i)) btn.classList.add('win-cell');
      btn.textContent = val || '';
      btn.disabled = !!val || gameOver;
      btn.addEventListener('click', () => handleMove(i));
      boardEl.appendChild(btn);
    });
  }

  function setStatus() {
    const result = checkResult(board);
    if (result) {
      gameOver = true;
      statusEl.classList.add('win');
      statusEl.textContent = result.winner === 'draw' ? "It's a draw" : `${result.winner} wins!`;
    } else {
      statusEl.classList.remove('win');
      statusEl.textContent = `${current}'s turn`;
    }
  }

  function handleMove(i) {
    if (gameOver || board[i]) return;
    board[i] = current;
    current = current === 'X' ? 'O' : 'X';
    render();
    setStatus();
    if (!gameOver && mode !== '2p' && current === 'O') {
      setTimeout(computerMove, 380);
    }
  }

  function computerMove() {
    if (gameOver) return;
    const empties = board.map((v, i) => (v ? null : i)).filter(v => v !== null);
    let choice;
    if (mode === 'easy') {
      choice = empties[Math.floor(Math.random() * empties.length)];
    } else {
      choice = minimax(board.slice(), 'O', 'O', 'X').index;
    }
    board[choice] = 'O';
    current = 'X';
    render();
    setStatus();
  }

  function newGame() {
    board = Array(9).fill(null);
    current = 'X';
    gameOver = false;
    render();
    setStatus();
  }

  modeBtns.forEach(btn => {
    btn.addEventListener('click', () => {
      modeBtns.forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      mode = btn.dataset.mode;
      newGame();
    });
  });

  resetBtn.addEventListener('click', newGame);

  render();
  setStatus();
</script>

</body>
</html>
